# ACT on the right-arm real dataset (tools/real_to_lerobot.py). Based on LeHome's configs/train_act.yaml (LeRobot
# 0.4.3, lerobot-train --config_path); single arm: 6-D state / action, global + wrist cameras. Input and output
# shapes come from the dataset metadata, so one file serves any camera resolution. Values are LeHome's, not tuned
# for this task (provisional).
#   .venv-train/bin/lerobot-train --config_path configs/real_training/act_right.yaml \
#       --dataset.root outputs/datasets/<name> --output_dir outputs/train/<run>
dataset:
  repo_id: local/so101-right
  root: outputs/datasets/right-act-v1
  # Image augmentation (LeRobot applies up to 3 of these per image, independently per camera, training only).
  # Narrower than LeRobot's defaults: block colour is the task (hue +-0.02 keeps red / yellow apart from pink /
  # beige), and the D455 is fixed with the target condition in tray mm, so shifts stay within ~2 % (~13 px).
  image_transforms:
    enable: true
    max_num_transforms: 3
    random_order: true
    tfs:
      brightness: {weight: 1.0, type: ColorJitter, kwargs: {brightness: [0.75, 1.25]}}
      contrast: {weight: 1.0, type: ColorJitter, kwargs: {contrast: [0.8, 1.2]}}
      saturation: {weight: 1.0, type: ColorJitter, kwargs: {saturation: [0.7, 1.3]}}
      hue: {weight: 0.5, type: ColorJitter, kwargs: {hue: [-0.02, 0.02]}}
      sharpness: {weight: 1.0, type: SharpnessJitter, kwargs: {sharpness: [0.5, 1.5]}}
      affine: {weight: 1.0, type: RandomAffine, kwargs: {degrees: [-2.0, 2.0], translate: [0.02, 0.02]}}

policy:
  type: act
  device: cuda
  push_to_hub: false

output_dir: outputs/train/act_right
batch_size: 16
steps: 30000
save_freq: 5000
log_freq: 1000

wandb:
  enable: false
