# SceneSpec: lab_20261125 plus the finals plush toy (Shiba Inu in an Enoden 305 tram, agentic_sim.plush; spec
# notes/261128_玩偶規格與決賽用法.md). Everything except the `plush` section and the name is a copy of
# lab_20261125.yaml; keep the two in step when the lab layout changes.
#
# SceneSpec: lab layout of 2026-11-25 (single right arm, finals rehearsal): lab_20261120 with the trays moved to the
# 11/25 D455 alignment (outputs/261125-trays/trays.json, reference image outputs/261125-camera/markers-1928/rgb.png),
# the arm at rest in the taught park pose, standby at the taught start pose and the beige reference slots of the real
# park-start collection (configs/real_slots.json). Everything not listed here is unchanged from lab_20261120.
# Every value carries its source:
#   measured   read from a device or an SDK, or measured with a ruler
#   estimated  derived from the captures (D455 depth + joint readback, image projection); method in `note`
#   provisional  product label, operator approximation or a choice for the simulation; not measured
# Frame: mount frame of the right follower (the only arm here), +X forward, +Y left, +Z up, metres. Origin on the
# table top below the robot base link (same frame as lab_current_minimal). The left arm of the dual layout is not
# modelled (single-arm environment until after the competition).
name: lab_20261128_plush
version: 0.1.0

robot:
  asset: Sim-to-Real-SO-101-Workshop@ce807d9 SO-ARM101-USD.usd (with the wrist camera mount)
  base_pos: {value: [0.0, 0.0, -0.0301], source: estimated,
             note: "base bottom on the table top; the D455 plane fit puts the table 1.6 mm below the base bottom"}
  # The lab arm carries the official SO-101 wrist camera mount (photos IMG_0541, IMG_0554). Isaac: Workshop USD with
  # the camera mount; MuJoCo: the Menagerie camera_mount body is kept. lab_current_minimal keeps the no-camera arm.
  wrist_camera_mount: true
  # Neutral finger direction: tangential to the pan circle (as lab_current_minimal; wrist roll about 90 deg at home).
  # The lab operators keep the wrist roll near 0 (radial fingers), but in simulation the radial grasp drops the
  # blocks that need a tilted gripper (fingers in the tilt plane: one jaw lower); tangential holds them
  # (handoff lens_check / radial sweep, 2026-11-21). The wrist camera is still on the real mount; only its side
  # relative to the scene differs at home.
  # 11/25 scene: radial fingers as the real demonstrations (wrist_roll about 3 deg at the start pose; standby here
  # solves to LeRobot wrist_flex 93 / wrist_roll 0 against the real 93.6 / 3.0). The tilted-grasp drops that made
  # lab_20261120 tangential came from the far part of the tray, which this layout does not use. Finals set, seeds
  # 11-16 x both answers (2026-11-26): radial 10/12, tangential 10/12, no drops in either; every failure is a wrist
  # confirmation miss in the near-left part of the pink tray (docs/finals-shortage.md).
  grasp_heading_deg: {value: 0.0, source: provisional, note: "radial, as the real arm grasps"}
  # Arm joints at reset: the lab rest pose (folded, gripper up); the arm then moves to the teleop home in about 2 s.
  start_pose_lerobot: {value: [1.67, -109.05, 97.32, 66.07, 3.03, 0.56], source: measured,
                       note: "taught park pose (outputs/routes/right-park-channel-261125.json park.pose); real standby"}
  # Standby / home of the scripted skills (mount frame, m): above the EE of the taught start pose (route end, where
  # every real demonstration leaves the fold; right-park-channel-261125.json channel.command, provisional joint map:
  # EE 0.187, 0.016, 0.199). The start pose holds the gripper tilted; the scripted skills keep it vertical and reach
  # at most z 0.10 there, so standby keeps the start-pose x / y at the teleop home height. The fold itself (park) is
  # only the reset pose: the scripted skills move in EE space and cannot reach the folded wrist.
  home_ee: {value: [0.187, 0.016, 0.09], source: estimated, note: "x / y of the taught start pose, z of configs/teleop.yaml home_ee"}

table:
  # The base is clamped at the front edge of a cubicle desk; the back partition is about 0.64 m ahead (D455 image).
  size: {value: [0.69, 1.40, 0.75], source: provisional,
         note: "x: front edge about 5 cm behind the base centre (photos) to the partition at x = 0.64 (D455 image); y and height not measured"}
  center_xy: {value: [0.295, 0.15], source: provisional}
  color: [0.72, 0.72, 0.74]   # light grey desk (D455 frame mean about 0.69 0.67 0.70)
  friction: {value: [0.6, 0.5], source: provisional, note: static/dynamic}

trays:
  # Centre and yaw: tray outline segmented in the D455 colour frame (single_right_stock_03 and dual_stock_01 agree
  # within 2 mm), rays intersected with the plane at rim height (camera pose below). Outer size: product label; the
  # projection gives pink 308 x 230 mm and beige 355 x 253 mm (beige edge contrast is weaker).
  storage_pink:
    outer_size: {value: [0.305, 0.23], source: provisional, note: "product label 30.5 x 23 cm; D455 projection 30.8 x 23.0 cm"}
    depth: {value: 0.013, source: provisional, note: "operator: total height about 17 mm (table to rim top) minus the floor"}
    wall_thickness: {value: 0.005, source: provisional, note: "operator: outer minus inner about 10 mm"}
    floor_thickness: {value: 0.004, source: provisional, note: "operator: inner floor at most 5 mm above the table"}
    center_xy: {value: [0.292, 0.184], source: estimated,
                note: "11/25 tray corners (trays.json) projected with the D455 pose below onto the rim plane; 292 x 208 mm"}
    yaw_deg: {value: 2.4, source: estimated, note: "11/25 tray corners (long sides)"}
    color: [0.95, 0.62, 0.68]
  placement_beige:
    outer_size: {value: [0.365, 0.265], source: provisional, note: "product label 36.5 x 26.5 cm; D455 projection 35.5 x 25.3 cm"}
    depth: {value: 0.019, source: provisional, note: "operator: total height about 23 mm minus the floor"}
    wall_thickness: {value: 0.005, source: provisional, note: "operator: outer minus inner about 10 mm"}
    floor_thickness: {value: 0.004, source: provisional, note: "operator: inner floor at most 5 mm above the table"}
    center_xy: {value: [0.319, -0.107], source: estimated,
                note: "11/25 tray corners (trays.json) projected with the D455 pose below onto the rim plane; 319 x 240 mm"}
    yaw_deg: {value: 1.0, source: estimated, note: "11/25 tray corners (long sides 3.2, short sides -1.2 deg)"}
    color: [0.80, 0.74, 0.66]
  friction: {value: [0.6, 0.5], source: provisional}

block:
  edge: {value: 0.0295, source: provisional, note: approximation of 2.9-3.0 cm batch, not per-block measured}
  mass: {value: 0.01669, source: measured, note: "batch of 64 blocks: mean 16.69 g, sample sd 1.18 g"}
  friction: {value: [1.0, 0.9], source: provisional, note: chosen for sim grasp, not measured}
  # Near part of the pink tray (real reach: tray-local x <= ~100 mm, mount x <= ~0.25); finals layouts are sampled
  # by configs/random_blocks_finals_20261125.yaml.
  init_xy: {value: [0.215, 0.160], source: provisional, note: near part of the 11/25 pink tray}
  init_yaw_deg: {value: 0.0, source: provisional}
  color: [0.85, 0.15, 0.15]
  count: 1
  max_count: 8
  layout_xy:
    value: [[0.215, 0.120], [0.215, 0.180], [0.215, 0.240], [0.250, 0.150],
            [0.250, 0.210], [0.180, 0.150], [0.180, 0.210], [0.250, 0.250]]
    source: provisional
    note: "6 cm grid in the near (reachable) part of the 11/25 pink tray"
  extra_palette: configs/palettes/block_colors.yaml

# Placement slots of the scripted place skill (mount frame, m): the beige reference slots of the real collection
# (configs/real_slots.json beige, tray-local [70, 30 / 95 / 160 / 225] mm) through the 11/25 beige corners. Replaces
# configs/task.yaml placement_slots for this scene.
placement_slots:
  value: [[0.228, -0.202], [0.229, -0.137], [0.230, -0.072], [0.232, -0.007]]
  source: estimated

camera:
  # viewer camera only: operator standing behind the right arm
  eye: [-0.32, -0.50, 0.62]
  target: [0.26, 0.04, 0.02]

# Sensor cameras (rendered views). Image axes follow OpenCV: x right, y down, z along the optical axis.
sensor_cameras:
  global:
    model: Intel RealSense D455, colour stream (firmware 5.12.6, USB 2.1)
    resolution: {value: [1280, 720], source: measured, note: full-video setting of the lab recordings (15 FPS)}
    intrinsics: {value: {fx: 639.5267, fy: 639.0475, cx: 640.1006, cy: 369.2910}, source: measured,
                 note: "librealsense colour intrinsics at 1280 x 720; inverse Brown-Conrady k1 -0.0552 k2 0.0636 not rendered"}
    # Pose: rigid ICP between D455 depth points of the arm (8 frames of right_arm_sag_02) and the SO-101 meshes
    # posed by the recorded joint readback; median residual 4.6 mm, 85 % of points within 10 mm. Camera stand
    # about 18-19 cm left of the right arm (operator, tape) agrees with y = 0.181.
    pos: {value: [0.3943, 0.1814, 0.5775], source: estimated, note: "optical centre of the colour camera, mount frame"}
    rot: {value: [[-0.01853, -0.99499, -0.09823], [-0.99960, 0.01632, 0.02327], [-0.02155, 0.09862, -0.99489]],
          source: estimated, note: "columns = camera x / y / z axes in the mount frame (5.8 deg off vertical)"}
  wrist:
    model: Innomaker U20CAM-1080p-S1 (MJPG)
    resolution: {value: [640, 480], source: measured, note: lab recording setting (30 FPS, 29.5 measured)}
    # Mounted on the official SO-101 wrist camera mount. Pose and field of view follow the Menagerie / Workshop
    # models of that mount (MuJoCo wrist_cam, vertical FOV 61 deg); the module's own intrinsics are not calibrated
    # (vendor: 103 deg horizontal; buyers report much less). Checked against the lab wrist frames, see docs.
    fovy_deg: {value: 61.0, source: provisional, note: "Menagerie wrist_cam fovy; Workshop gripper_cam 13.5 mm focal length (vertical 60 deg at 4:3)"}
    # Camera frame in the gripper link frame (same frame in the Workshop USD and the Menagerie MJCF), USD / MuJoCo
    # camera axes: looks along -Z, +Y up. Values of the Menagerie wrist_cam.
    # Lens (raw image): estimated on the 2026-11-20 wrist frames with exactly these values (640 x 480, fx = fy = 400,
    # centre 320 / 240, k1 -0.15, other coefficients 0): plumb-line residual of 83 straight edges in 38 frames
    # 6.82 -> 4.25, jaw overlap with the mount pose below IoU 0.73 (ideal pinhole 0.72, 7 frames). The public U20CAM
    # 640 x 480 profile (so101_ros2: f 550.8, k1 -0.448, k2 0.215) straightens the edges as well (4.17) but puts the
    # jaws too small and low (IoU 0.33), so it is kept only as a reference. Raw frames are straightened with
    # tools/undistort_wrist.py (same values).
    lens:
      intrinsics: {value: {fx: 400.0, fy: 400.0, cx: 320.0, cy: 240.0}, source: estimated,
                   note: "jaw overlap + plumb line on 38 raw wrist frames (2026-11-20); no checkerboard yet"}
      distortion: {value: [-0.15, 0.0, 0.0, 0.0, 0.0], source: estimated, note: "OpenCV k1 k2 p1 p2 k3; k1 only"}
    # real: the simulated wrist image is resampled to look like the raw camera; pinhole: ideal image with fovy_deg
    lens_mode: real
    pose_in_gripper:
      pos: {value: [-0.00296, 0.05436, -0.05310], source: provisional, note: Menagerie camera_mount wrist_cam}
      quat_wxyz: {value: [0.958280, -0.285792, -0.001556, 0.004547], source: provisional, note: Menagerie camera_mount wrist_cam}

# Finals plush toy: free rigid body (agentic_sim.plush: 90 x 60 x 100 mm, 28.6 g), bottom face on the floor of the
# pink tray (11/28 decision: the plush starts in the pink tray with the blocks; notes/261128_玩偶規格與決賽用法.md
# section 8). Spot: the reachable near-right corner of the pink tray (r 0.25 m, inside the real safe grasp zone
# r <~ 0.31 m there). 54 mm from the centre to the tram's farthest corner, so every yaw clears the inner walls
# (x >= 0.145, y >= 0.074 here). Demonstrations vary around it, any yaw: x +- 15 mm, y 0 to +20 mm (inner walls).
# Keep blocks 50 mm or more from the tram (D455 drops block detections within 12 mm of it; the open jaw is 68 mm).
# yaw 0: tram along mount +X, the cab and the dog face +X (away from the base).
plush:
  tray: storage_pink
  pos: {value: [0.215, 0.130], source: provisional, note: "simulation choice; the real plush spot is checked on 11/30"}
  yaw_deg: {value: 0.0, source: provisional}
  # Block positions of this scene (replace block.init_xy / layout_xy, which share the corner with the plush): the
  # reachable pink cells 83-133 mm from the plush centre (the tram reaches 54 mm at any yaw) and 40-49 mm apart, so
  # the four finals blocks fit beside the plush with about 1 cm between blocks (tight for the programmed grasp).
  block_xy:
    value: [[0.165, 0.215], [0.205, 0.225], [0.250, 0.205], [0.170, 0.255]]
    source: provisional
    note: "r 0.27-0.32 m, inside the real safe grasp zone (0.33 m at 40-56 deg)"
