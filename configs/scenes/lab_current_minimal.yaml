# SceneSpec: minimal lab_current scene for issue #1 (keyboard/mouse EE pick-and-place).
# Every dimension carries its source: provisional (product label / estimate / approximation) or measured.
# Frame: mount frame = robot base on the table top, +X forward, +Y left, +Z up, metres.
name: lab_current_minimal
version: 0.1.0-provisional

robot:
  asset: Sim-to-Real-SO-101-Workshop@ce807d9 SO-ARM101-USD-NO-CAMERA.usd
  base_pos: {value: [0.0, 0.0, 0.0], source: provisional, note: base on the table top; real mount position not measured}

table:
  size: {value: [0.80, 1.00, 0.75], source: provisional, note: light-white static box; real table not measured}
  center_xy: {value: [0.25, 0.0], source: provisional}
  color: [0.92, 0.92, 0.90]
  friction: {value: [0.6, 0.5], source: provisional, note: static/dynamic}

trays:
  storage_pink:
    outer_size: {value: [0.305, 0.23], source: provisional, note: product label 30.5 x 23 cm}
    depth: {value: 0.010, source: provisional, note: estimated about 1 cm}
    wall_thickness: {value: 0.003, source: provisional, note: not measured}
    floor_thickness: {value: 0.002, source: provisional, note: not measured}
    center_xy: {value: [0.225, 0.150], source: provisional, note: placed so part of the tray lies inside the downward-grasp reach}
    yaw_deg: {value: 0.0, source: provisional}
    color: [0.95, 0.62, 0.72]
  placement_beige:
    outer_size: {value: [0.365, 0.265], source: provisional, note: product label 36.5 x 26.5 cm}
    depth: {value: 0.010, source: provisional, note: estimated about 1 cm}
    wall_thickness: {value: 0.003, source: provisional, note: not measured}
    floor_thickness: {value: 0.002, source: provisional, note: not measured}
    center_xy: {value: [0.255, -0.170], source: provisional}
    yaw_deg: {value: 0.0, source: provisional}
    color: [0.90, 0.84, 0.70]
  friction: {value: [0.6, 0.5], source: provisional}

block:
  edge: {value: 0.0295, source: provisional, note: approximation of 2.9-3.0 cm batch, not per-block measured}
  mass: {value: 0.01669, source: provisional, note: batch average 16.69 g}
  friction: {value: [1.0, 0.9], source: provisional, note: chosen for sim grasp, not measured}
  init_xy: {value: [0.170, 0.120], source: provisional, note: inside the pink tray, within reach}
  init_yaw_deg: {value: 0.0, source: provisional}
  color: [0.85, 0.15, 0.15]

camera:
  # viewer camera only (no sensor camera in this issue)
  eye: [0.72, -0.48, 0.48]
  target: [0.17, 0.0, 0.02]
