# Issue #5 acceptance 3b: same as hold_return, but the answer is "deliver anyway": red 2 goes into the placement tray,
# the over-delivery is reported as approved by the user and is not retrieved.
name: hold_deliver
blocks: [red, red, red, blue, blue, yellow]
order: {red: 3}
timeout_s: 160
events:
  - when: {event: phase, skill: place, color: red, nth: 2, phase: transport}
    after_s: 0.5
    order: {total: {red: 1, blue: 2}}
  - when: {event: question, kind: held_item}
    after_s: 3.0
    answer: {choice: deliver}
checks:
  - {question: {kind: held_item, color: red, block: 1}}
  - {hold_still: {mm: 3.0}}
  - {over_delivery: {color: red, over: 0, accepted: 1, action: kept (user approved)}}
  - no_over_delivery_retrieval
  - {final_placement: {red: 2, blue: 2}}
  - {ledger: {target: {red: 1, blue: 2}, delivered: {red: 2, blue: 2}, accepted_extra: {red: 1}}}
  - no_drop
  - no_stale_commands
  - skills_ok
