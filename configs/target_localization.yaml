# Coarse-to-fine target localization (agentic_sim.perception.localize): global camera candidates, wrist close-up.
# Provisional: chosen from the rendered MuJoCo / Isaac evaluations (outputs/perception-validation), not real cameras.
source: provisional
# Global-camera colours that may really be the requested colour. From the 10+10 rendered evaluation episodes the
# only global confusions were dark_green -> light_green (15 MuJoCo / 7 Isaac) and light_green -> yellow (7 / 7);
# the wrist camera had none. So a dark_green request also tries global "light_green" blocks, a light_green
# request also tries global "yellow" ones; the wrist decides.
global_lookalikes:
  dark_green: [light_green]
  light_green: [yellow, dark_green]
max_candidates: 4            # global candidates tried (exact colour first, then look-alikes)
association_gate_m: 0.03     # wrist fit counts as the candidate when its centre is this close (xy) to the global one
# EE heights tried for the close-up of one candidate; the next height only when the wrist did not get an accepted
# fit there (clipped, poor fit). Lower = larger block in the image, higher = more margin to the image border.
view_ee_z: [0.10, 0.12]
settle_frames: 30            # control frames at the view before the wrist capture
# Colour-only confirmation (wrist sees the target colour where the candidate is, but cannot fit a cube there, e.g. two
# same-colour blocks touching in the image; the pose then comes from the global fit): the covering silhouette must
# be at least this fraction of the candidate cube's projected area. A single face split off a block by the hue
# bands is smaller and its hue unreliable (a light green top face reads yellow).
color_only_min_area_fraction: 0.7
# Colours that need a full wrist fit (whole cube, top and sides) to be confirmed: one face alone does not separate
# them. A light green top face reads yellow from the wrist (3 wrong confirmations in 110 MuJoCo episodes before this).
color_only_excluded: [yellow, light_green, dark_green]

# Depth height check of each global colour segment (agentic_sim.perception.height): finds stacked, tilted, merged
# and partly hidden blocks before localizing. Uses the global D455 depth aligned to the colour image.
height_check:
  erode_px: 2              # mask erosion before back-projection (drops flying edge pixels)
  plane_tol_m: 0.0015      # RANSAC inlier distance for the top face (widened to 3 sigma of the measured noise)
  min_points: 30
  tilt_max_deg: 5.0        # top face tilted more than this: tilted
  side_face_min_deg: 70.0  # steeper: a shaded side split off by hue, ignored (measured side faces 79-86 deg)
  layer_tol: 0.15          # |height / edge - nearest whole layer| above this: off_layer
  min_area_faces: 0.5      # top face smaller than this many faces: partial (hidden in part)
  merged_area_faces: 1.6   # larger: touching blocks of one colour
  second_face_min_faces: 0.3  # a second plane this large, tilted (not a side): a tilted block inside the segment
  close_gap_m: 0.015       # provisional gripper clearance between two tops (finger width not measured yet)
  hull_margin_m: 0.002     # the depth top face misses about this much rim per side (erosion, plane band)

# Decluttering before localization (agentic_sim.task.declutter): move blocks out of the way of the target.
declutter:
  max_moves: 4               # moves per target before reporting to the LLM
  max_localize_attempts: 3   # targets the wrist could not confirm; each is excluded and the rules run again
  max_failures_per_item: 2   # a block whose pick and push both failed this often is left alone
  support_gap_m: 0.005       # tops this close: touching (a tilted block leans on it, a stacked block sits on it)
  place_clearance_m: 0.025   # a moved block is set down at least this far from every other top
  place_avoid_target_m: 0.06 # and at least this far from the target
  push_distance_m: 0.04      # push the block this far past its centre (when the pick fails)
  finger_room_m: 0.018       # room beside the block for the opening finger (53 mm open - 29.5 mm block - 5 mm offset)
  deliver_inset_m: 0.02      # a target carried to the placement tray is set down this far inside its walls
