# Keyboard pick and place of block 0 with all 8 blocks in the pink tray (run with 8 blocks): the neighbours must not
# get in the way, and Reset puts every block back. Same key sequence as keyboard_pick_place.
# Every motion is a held key (W/S/A/D/E/Q/Z/X/O/C) injected as real carb keyboard events; `until` only decides
# when the "operator" lets go of the key. Nothing in the script touches the robot, the target or the block.
- {wait: 3.0}
- {check: "n_blocks == 8", label: "8 blocks in the scene"}
- {mark: start}
- {note: "open gripper"}
- {hold: [O], until: "gripper >= 0.5", timeout: 3}
- {note: "approach: above the block"}
# Operator clearance: the EE is the grasp centre with the cube flush against the fixed finger, which sits on the
# -Y side once the gripper is yawed for this cube. Like a human operator, stop ~5 mm short on that side so the fixed
# finger clears the cube top; closing the jaw then pushes the cube against the fixed finger.
- {hold: [W], until: "target[0] >= 0.168", timeout: 4}
- {hold: [A], until: "target[1] >= 0.112", timeout: 4}
- {note: "yaw so the fingers face the cube sides"}
- {hold: [Z], until: "yaw_offset <= -0.59", timeout: 3}
- {wait: 1.0}
- {note: "descend"}
- {hold: [Q], until: "target[2] <= 0.025", timeout: 4}
- {wait: 1.5}
- {check: "abs(ee[0] - block[0]) < 0.012 and abs(ee[1] - block[1]) < 0.012 and ee[2] < 0.035", label: "approach: EE lowered around the block (not resting on top)"}
- {note: "grasp"}
- {hold: [C], until: "gripper <= -0.17", timeout: 3}
- {wait: 1.0}
- {check: "jaw > 0.05", label: "grasp: jaw stopped by the block (physical contact, not closed)"}
- {note: "lift"}
- {hold: [E], until: "target[2] >= 0.10", timeout: 4}
- {wait: 1.0}
- {check: "block[2] > 0.06", label: "lift: block raised with the gripper"}
- {note: "carry"}
- {hold: [D], until: "target[1] <= -0.120", timeout: 6}
- {hold: [W], until: "target[0] >= 0.190", timeout: 3}
- {wait: 1.0}
- {check: "block[2] > 0.06 and abs(block[1] - ee[1]) < 0.02", label: "carry: block still held over the beige tray"}
- {note: "lower and release"}
- {hold: [Q], until: "target[2] <= 0.040", timeout: 4}
- {wait: 0.8}
- {hold: [O], until: "gripper >= 0.5", timeout: 3}
- {wait: 1.0}
- {hold: [E], until: "target[2] >= 0.10", timeout: 4}
- {wait: 1.5}
- {check: "block_in_placement", label: "place: block resting inside the beige tray"}
- {check: "blocks_in_placement == 1 and all(max(abs(b[k] - a[k]) for k in range(2)) < 0.01 for a, b in zip(m['start']['blocks'][1:], blocks[1:]))", label: "neighbours: the other 7 blocks stayed in place (within 1 cm)"}
- {check: "stats['rejected_targets'] == 0 and stats['max_dq_cmd_per_frame'] < 0.06", label: "no rejected targets, no joint-command jumps"}
- {note: "reset after the block was moved"}
- {tap: R}
- {wait: 1.5}
- {check: "block_in_storage and all(abs(b[0] - i[0]) < 0.002 and abs(b[1] - i[1]) < 0.002 for b, i in zip(blocks, blocks_init))", label: "reset: all 8 blocks back at their initial poses"}
- {check: "abs(target[0] - home[0]) < 0.003 and abs(target[2] - home[2]) < 0.003 and gripper > 0.5 and yaw_offset == 0", label: "reset: target, yaw and gripper restored"}
- {wait: 1.5}
