# Capture pipeline test only (issue #13): keyboard pick of the yellow block (slot 1) into the beige tray, injected as
# real carb keyboard events through the operator's input path. Episodes recorded with --script are marked
# operator: scripted_input and are NOT demonstrations; the acceptance episode is teleoperated by a person.
# Waypoints follow configs/trajectories/lab_pick_place.yaml (5 mm short on the fixed-finger side, yaw offset =
# -(heading from the pan axis) so the fingers face the cube sides).
- {wait: 4.0}
- {hold: [O], until: "gripper >= 0.5", timeout: 3}
- {hold: [W], until: "target[0] >= 0.230", timeout: 5}
- {hold: [A], until: "target[1] >= 0.155", timeout: 5}
- {hold: [Z], until: "yaw_offset <= -0.60", timeout: 3}
- {hold: [Q], until: "target[2] <= 0.029", timeout: 5}
- {wait: 1.2}
- {hold: [C], until: "gripper <= -0.17", timeout: 3}
- {wait: 1.0}
- {check: "jaw > 0.05", label: "grasp: jaw stopped by the block"}
- {hold: [E], until: "target[2] >= 0.105", timeout: 5}
- {wait: 0.8}
- {check: "blocks[1][2] > 0.06", label: "lift: yellow block raised"}
- {hold: [D], until: "target[1] <= -0.130", timeout: 8}
- {wait: 0.8}
- {hold: [Q], until: "target[2] <= 0.045", timeout: 5}
- {wait: 0.6}
- {hold: [O], until: "gripper >= 0.5", timeout: 3}
- {wait: 0.8}
- {hold: [E], until: "target[2] >= 0.105", timeout: 5}
- {wait: 3.0}
