# Host-side Python environment (uv). Covers the pure-Python parts: experiment registry, menu, client/protocol,
# kinematics and tests. Isaac Sim runs in its own container (docker/isaac/) and does not use this environment.
[project]
name = "agentic-robotic-simulator"
version = "0.1.0"
requires-python = ">=3.11"   # mujoco 4.x needs 3.11+ (same as the Isaac container)
dependencies = [
    "numpy>=1.26",
    "pyyaml>=6.0",
    "mujoco==4.0.1",   # MuJoCo backend; 4.0.0 has a sparse Cholesky bug (slow or divergent solves)
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
