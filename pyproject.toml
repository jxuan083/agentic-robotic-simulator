# Host-side Python environment (uv). Covers the pure-Python parts: experiment registry, menu, client/protocol,
# kinematics and tests. Isaac Sim runs in its own container (docker/isaac/) and does not use this environment.
[project]
name = "agentic-robotic-simulator"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
